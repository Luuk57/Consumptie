<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocht & Consumptie Monitor</title>
    <style>
        :root {
            --win-blue: #0078d7;
            --win-bg: #f3f3f3;
            --win-dark: #202020;
            --card-bg: #ffffff;
            --border-color: #d1d1d1;
            --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --green-ok: #107c41;
            --red-alert: #d13438;
            --orange-warn: #ca5010;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }
        body, html { width: 100%; height: 100%; background: var(--win-bg); color: var(--win-dark); display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .header {
            background: var(--win-blue); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; flex-shrink: 0;
        }
        .header-btns { display: flex; gap: 6px; }
        .top-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .top-btn-pdf { background: #107c41; }

        /* TAB BAR */
        .tab-bar { display: flex; background: #e5e5e5; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: bold; background: #d6d6d6; border: none; cursor: pointer; text-align: center; color: #444; }
        .tab-btn.active { background: var(--card-bg); color: var(--win-blue); border-bottom: 3px solid var(--win-blue); }

        /* CONTENT */
        .tab-content { display: none; flex: 1; padding: 12px; overflow-y: auto; width: 100%; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 12px; width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .section-title { font-size: 12px; font-weight: bold; color: var(--win-blue); text-transform: uppercase; margin-bottom: 8px; border-bottom: 2px solid var(--win-blue); padding-bottom: 3px; }

        .form-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
        .form-group label { font-size: 11px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* PROGRESS DASHBOARD */
        .dashboard-box { background: #eef6fc; border-left: 4px solid var(--win-blue); padding: 10px; border-radius: 4px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-stat { font-size: 16px; font-weight: bold; }

        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; text-align: center; }
        .btn-save { background: var(--win-blue); width: 100%; padding: 12px; font-size: 14px; margin-top: 10px; }
        
        .btn-small { padding: 4px 6px; font-size: 11px; border: none; border-radius: 3px; cursor: pointer; color: white; font-weight: bold; }
        .btn-del { background: #d13438; }
        .btn-edit { background: #0078d7; }

        table.dialyse-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px; background: #fff; }
        table.dialyse-table th, table.dialyse-table td { border: 1px solid #ddd; padding: 6px; text-align: left; vertical-align: middle; }
        table.dialyse-table th { background: var(--win-blue); color: white; }

        @media print {
            body { background: white; color: black; overflow: auto; display: block; }
            .header, .tab-bar, .btn-save, .card:not(#historieTab .card), .top-btn { display: none !important; }
            .tab-content { display: none !important; }
            #historieTab { display: block !important; padding: 0 !important; }
            .card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <span>💧 Vocht & Consumptie Monitor</span>
        <div class="header-btns">
            <button type="button" class="top-btn top-btn-pdf" id="btnPdf">📄 Pro PDF</button>
            <button type="button" class="top-btn" id="btnFullscreen">⛶ Scherm</button>
            <button type="button" class="top-btn" id="btnSync">🔄 Sync</button>
        </div>
    </div>

    <!-- TABBALK -->
    <div class="tab-bar">
        <button type="button" class="tab-btn active" id="tabInvoerBtn" data-target="invoerTab">📝 Vocht Invoer</button>
        <button type="button" class="tab-btn" id="tabDrankenBtn" data-target="drankenTab">🥤 Dranken Beheer</button>
        <button type="button" class="tab-btn" id="tabHistorieBtn" data-target="historieTab">📊 Historie & Totaal</button>
    </div>

    <!-- TAB 1: VOCHT INVOER -->
    <div id="invoerTab" class="tab-content active">
        <!-- DAGELIJKS LIMIET DASHBOARD -->
        <div class="dashboard-box" id="dashboardBox">
            <div>
                <div style="font-size: 11px; color: #555; font-weight: bold;">TOTAAL VANDAAG</div>
                <div class="dashboard-stat" id="totaalVandaagTxt">0 ml / 1000 ml</div>
            </div>
            <div id="statusIndicatorTxt" style="font-weight: bold; font-size: 12px; padding: 4px 8px; border-radius: 3px; background: #107c41; color: white;">Binnen limiet</div>
        </div>

        <div class="card">
            <div class="section-title">⏱️ Tijd & Datum</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="invoerDatum">
                </div>
                <div class="form-group">
                    <label>Tijd</label>
                    <input type="time" id="invoerTijd">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">🥤 Consumptie Details</div>
            <div class="form-group">
                <label>Soort Drank</label>
                <select id="selectDrank" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff;"></select>
            </div>
            <div class="form-group" style="margin-top: 6px;">
                <label>Hoeveelheid (ml)</label>
                <input type="number" id="hoeveelheidMl" placeholder="Bijv. 200" value="200">
            </div>
            <div class="form-group" style="margin-top: 6px;">
                <label>Opmerking (Optioneel)</label>
                <input type="text" id="notitie" placeholder="Bijv. Tijdens maaltijd">
            </div>
            <button type="button" class="action-btn btn-save" id="slaVochtBtn">💾 VOCHT TOEVOEGEN</button>
        </div>
    </div>

    <!-- TAB 2: DRANKEN BEHEER -->
    <div id="drankenTab" class="tab-content">
        <div class="card">
            <div class="section-title">➕ Nieuwe Drank Toevoegen</div>
            <div class="form-group">
                <label>Naam Drankje</label>
                <input type="text" id="nieuweDrankNaam" placeholder="Bijv. Appelsap">
            </div>
            <button type="button" class="action-btn btn-save" id="voegDrankToeBtn">+ Drank Toevoegen</button>
        </div>

        <div class="card">
            <div class="section-title">📋 Beschikbare Dranken</div>
            <table class="dialyse-table">
                <thead>
                    <tr>
                        <th>Drank Soort</th>
                        <th style="width: 80px;">Actie</th>
                    </tr>
                </thead>
                <tbody id="drankenTabelBody">
                    <tr><td colspan="2" style="color: #888;">Dranken laden...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 3: HISTORIE -->
    <div id="historieTab" class="tab-content">
        <div class="card">
            <div class="section-title">📊 Vocht Historie Overzicht</div>
            <table class="dialyse-table">
                <thead>
                    <tr>
                        <th>Datum & Tijd</th>
                        <th>Soort</th>
                        <th>Hoeveelheid</th>
                        <th>Opmerking</th>
                        <th style="width: 70px;">Actie</th>
                    </tr>
                </thead>
                <tbody id="historieTabelBody">
                    <tr><td colspan="5" style="color: #888;">Gegevens laden...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Jouw nieuwe Vocht Bin ID:
        const JSONBIN_ID = "6acf8996ffd5d160536a8b2c"; 
        const API_KEY = "$2a$10$AAsaI9LebId4BAj60iBn3.V/Y3ayfLpT5qI5vhouztfHHUpgmuQdG";
        const DAGLIMIET = 1000;

        let centraleData = { 
            vocht: [], 
            dranken: ["Water", "Thee", "Koffie", "Ranja", "Melk", "Soep"] 
        };

        window.addEventListener('DOMContentLoaded', () => {
            let nu = new Date();
            let offsetMs = nu.getTimezoneOffset() * 60000;
            let localIso = new Date(nu.getTime() - offsetMs).toISOString();
            document.getElementById('invoerDatum').value = localIso.split('T')[0];
            document.getElementById('invoerTijd').value = localIso.split('T')[1].slice(0, 5);

            document.getElementById('btnSync').addEventListener('click', laadDataVanBin);
            document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('btnPdf').addEventListener('click', genereerProPDF);

            document.getElementById('voegDrankToeBtn').addEventListener('click', voegDrankToe);
            document.getElementById('slaVochtBtn').addEventListener('click', slaVochtNaarBin);

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => wisselTab(e.target.dataset.target, e.target.id));
            });

            laadDataVanBin();
        });

        function laadDataVanBin() {
            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                centraleData = data.record || centraleData;
                if (!centraleData.dranken) centraleData.dranken = ["Water", "Thee", "Koffie", "Ranja", "Melk", "Soep"];
                if (!centraleData.vocht) centraleData.vocht = [];

                vulDrankenDropdown();
                vulDrankenTabel();
                vulHistorieTabel();
                berekenVandaagTotaal();
            })
            .catch(err => console.error("Fout bij laden van JSONBin:", err));
        }

        function slaGeheleDataNaarBin() {
            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(centraleData)
            })
            .then(res => res.json())
            .catch(err => alert("Fout bij opslaan in cloud: " + err));
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function wisselTab(targetId, btnId) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
        }

        function vulDrankenDropdown() {
            let select = document.getElementById('selectDrank');
            let huidigeVal = select.value;
            select.innerHTML = '';
            centraleData.dranken.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d;
                opt.innerText = d;
                select.appendChild(opt);
            });
            if (huidigeVal) select.value = huidigeVal;
        }

        function vulDrankenTabel() {
            let tbody = document.getElementById('drankenTabelBody');
            tbody.innerHTML = '';
            centraleData.dranken.forEach((d, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${d}</b></td>
                    <td><button type="button" class="btn-small btn-del" onclick="verwijderDrank(${index})">Wis</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function voegDrankToe() {
            let input = document.getElementById('nieuweDrankNaam');
            let drank = input.value.trim();
            if (!drank) return;
            if (!centraleData.dranken.includes(drank)) {
                centraleData.dranken.push(drank);
                input.value = '';
                slaGeheleDataNaarBin();
                vulDrankenDropdown();
                vulDrankenTabel();
            }
        }

        window.verwijderDrank = function(index) {
            if (confirm('Weet je zeker dat je deze drank wilt verwijderen?')) {
                centraleData.dranken.splice(index, 1);
                slaGeheleDataNaarBin();
                vulDrankenDropdown();
                vulDrankenTabel();
            }
        };

        function slaVochtNaarBin() {
            let item = {
                Datum: document.getElementById('invoerDatum').value,
                Tijd: document.getElementById('invoerTijd').value,
                Soort: document.getElementById('selectDrank').value,
                Hoeveelheid: parseInt(document.getElementById('hoeveelheidMl').value) || 0,
                Notitie: document.getElementById('notitie').value || '-'
            };

            if (!centraleData.vocht) centraleData.vocht = [];
            centraleData.vocht.unshift(item);
            slaGeheleDataNaarBin();
            vulHistorieTabel();
            berekenVandaagTotaal();
            document.getElementById('notitie').value = '';
            alert('Vochtconsumptie opgeslagen in cloud!');
        }

        window.verwijderVocht = function(index) {
            if (confirm('Weet je zeker dat je dit item wilt verwijderen?')) {
                centraleData.vocht.splice(index, 1);
                slaGeheleDataNaarBin();
                vulHistorieTabel();
                berekenVandaagTotaal();
            }
        };

        function berekenVandaagTotaal() {
            let vandaagStr = new Date().toISOString().split('T')[0];
            let totaal = 0;

            if (centraleData.vocht) {
                centraleData.vocht.forEach(v => {
                    if (v.Datum === vandaagStr) {
                        totaal += parseInt(v.Hoeveelheid) || 0;
                    }
                });
            }

            document.getElementById('totaalVandaagTxt').innerText = `${totaal} ml / ${DAGLIMIET} ml`;
            let indicator = document.getElementById('statusIndicatorTxt');
            
            if (totaal > DAGLIMIET) {
                indicator.innerText = "⚠️ Limiet overschreden!";
                indicator.style.background = "var(--red-alert)";
            } else if (totaal >= DAGLIMIET * 0.8) {
                indicator.innerText = "⚠️ Bijna op limiet";
                indicator.style.background = "var(--orange-warn)";
            } else {
                indicator.innerText = "✅ Binnen limiet";
                indicator.style.background = "var(--green-ok)";
            }
        }

        function vulHistorieTabel() {
            let tbody = document.getElementById('historieTabelBody');
            tbody.innerHTML = '';
            if (!centraleData.vocht || centraleData.vocht.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: #888;">Geen consumpties geregistreerd.</td></tr>';
                return;
            }

            centraleData.vocht.forEach((v, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.Datum} ${v.Tijd}</td>
                    <td><b>${v.Soort}</b></td>
                    <td><b>${v.Hoeveelheid} ml</b></td>
                    <td>${v.Notitie}</td>
                    <td><button type="button" class="btn-small btn-del" onclick="verwijderVocht(${index})">Wis</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function genereerProPDF() {
            wisselTab('historieTab', 'tabHistorieBtn');
            setTimeout(() => {
                window.print();
            }, 300);
        }
    </script>
</body>
</html>
